services:
  - type: web
    name: smart1ski
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GHL_WEBHOOK_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: REPORT_NAME
        value: dealership-rv-report
