services:
  - type: web
    name: smart1ski
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: GHL_WEBHOOK_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: REPORT_NAME
        value: dealership-rv-report
